# The gallery's examples in a web page, one at a time, for the website's chart pages (/charts): the stage
# behind their live render. `python platform/wasm/build.py addons/bui-charts/web` builds it to WebAssembly.
# Its own workspace, like examples/wasm/counter: no other platform builds it.
[package]
name = "bui-charts-web"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# the kit features a page can build (blenderui-web's, plus `video`, which the kit's audio code needs to link)
blenderui = { path = "../../../bindings/rust/blenderui", default-features = false, features = ["png", "svg", "freetype", "anim", "video"] }
blenderui-web = { path = "../../../bindings/rust/blenderui-web" }
bui-charts = { path = "..", default-features = false }
bui-panels = { path = "../../bui-panels", default-features = false, features = ["pinch"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"

# nursery
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"

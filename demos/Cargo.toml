[package]
name = "bui-demos"
version = "0.0.0"
edition = "2024"
publish = false
description = "Demos built on BUI: shader components, glass and skeuomorphic apps, menus, players and portfolio motion."

# Standalone: not a member of bindings/rust's workspace, so the main tree is untouched.
[workspace]

[dependencies]
blenderui = { path = "../bindings/rust/blenderui" }
png = "0.17"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
unreadable_literal = "allow"
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"

[package]
name = "bui-a11y"
description = "Screen-reader accessibility for the BUI kit: its flat node trees as AccessKit trees, and the platform adapters"
# a member of the Rust bindings' workspace: one version and lock with the crates that use it, and
# blenderui-sys can be packaged against it before it is on crates.io (`cargo package -p bui-a11y
# -p blenderui-sys`)
workspace = "../bindings/rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# include/bui_a11y.h: the C declarations of the ABI (the kit includes it)
include = ["src/**", "include/**", "Cargo.toml"]

# An rlib for Rust programs (blenderui-sys links it with the kit); C builds of the kit run
# `cargo rustc --crate-type staticlib` (kit/CMakeLists.txt), so no staticlib is built here.
[lib]
path = "src/lib.rs"

[dependencies]
accesskit = "0.25"

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.35"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"
